[project]
name = "ccl-segb"
version = "0.4.0"
description = "A Python library for parsing SEGB v1 and v2 files found on iOS, macOS, etc."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Caithness" }
]
dependencies = [
    "bbpb>=1.4.2",
    "rich>=14.3.2",
    "typer>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccl_segb"]

[project.scripts]
ccl-segb = "ccl_segb.cli.main:app"
